version: "2.4"

networks:
  aquabutlers-net:
    driver: bridge

volumes:
  shared-config:
  # mqtt-bridge SQLite outbox — survives Pi power loss / container restart.
  bridge-data:
  # Provisioner persistent storage — survives balenaOS re-flash.
  # Holds /mnt/data/customer_id (the tenant key) and the retained config
  # messages drained from the central broker.
  provisioner-data:

services:
  njspc:
    build:
      context: ./AquaButler-Control-njsPC
    ports:
      - "4200:4200"
    networks:
      - aquabutlers-net
    volumes:
      - shared-config:/app/config
    environment:
      - MQTT_BROKER_URL=mqtt://mqtt:1883
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    restart: unless-stopped
    depends_on:
      - mqtt

  dashboard:
    build:
      context: ./AquaButler-Control-dashPanel
    ports:
      - "5150:5150"
    networks:
      - aquabutlers-net
    volumes:
      - shared-config:/app/config
    environment:
      - MQTT_BROKER_URL=mqtt://mqtt:1883
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    restart: unless-stopped
    depends_on:
      - mqtt

  rem:
    build:
      context: ./AquaButler-Control-REM
    ports:
      - "7070:7070"
    networks:
      - aquabutlers-net
    volumes:
      - shared-config:/app/config
    environment:
      - MQTT_BROKER_URL=mqtt://mqtt:1883
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    restart: unless-stopped
    depends_on:
      - mqtt

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - aquabutlers-net
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - shared-config:/mosquitto/data
    restart: unless-stopped

  aqualinkd:
    # Uses Balena-ready Dockerfile (in root of AqualinkD repo)
    # NOTE: %%BALENA_MACHINE_NAME%% template variable is substituted by Balena during build
    build:
      context: ./AqualinkD
    ports:
      - "6171:6171"
    networks:
      - aquabutlers-net
    volumes:
      - shared-config:/aquadconf
    devices:
      # Serial device for RS-485 communication with Jandy AquaLink
      # Map to /dev/serial0 or /dev/ttyUSB0 depending on hardware
      - "/dev/serial0:/dev/serial0"
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    environment:
      - MQTT_BROKER_URL=mqtt://mqtt:1883
    restart: unless-stopped
    depends_on:
      - mqtt

  # ----------------------------------------------------------------------------
  # provisioner — first-boot customer-id capture + MQTT restore trigger.
  # ----------------------------------------------------------------------------
  # Runs as a privileged host-networked sidecar. On boot:
  #   - if /mnt/data/customer_id is missing, brings up the captive portal
  #     (calls `systemctl start aquabutlers-portal.target` which lives on the
  #     balenaOS host, not in this container) and serves the form on :80.
  #   - on form submit: writes customer_id, reboots.
  #   - on next boot, enters restore mode: connects to the central broker
  #     using MQTT_USER_<ID>/MQTT_PASS_<ID> env vars, publishes
  #     pool/<id>/cmd/restore, and forwards retained pool/+/config/# messages
  #     into /mnt/data/njspc-config for njsPC to consume.
  #
  # Repo: https://github.com/ultron-aquabutler/aquabutlers-provisioner
  # Wire protocol locked by orchestrator t_03d484e8 (Phase A).
  provisioner:
    build:
      context: ../aquabutlers-provisioner
      dockerfile: Dockerfile
    # Host network so :80 is reachable as the captive portal's DNS hijack
    # target on wlan0. Privileged so it can systemctl the host's portal.target
    # and read /mnt/data (a balena-supervisor managed persistent volume).
    network_mode: host
    privileged: true
    restart: unless-stopped
    volumes:
      # Persistent storage for customer_id (survives re-flash) and njsPC config
      # messages drained from the central broker.
      - provisioner-data:/mnt/data
    environment:
      # Central broker — overridden per device via balena env set.
      - MQTT_BROKER_URL=mqtt://mqtt.aquabutlers.com:1883
      # Per-customer creds (set at fleet registration time):
      # MQTT_USER_<CUSTOMER_ID_UPPER_WITH_UNDERSCORES>=<user>
      # MQTT_PASS_<CUSTOMER_ID_UPPER_WITH_UNDERSCORES>=<pass>
      # See Provisioning_First_Boot.md for the registration flow.
    # No `depends_on` — this service MUST boot independently of mqtt/njspc.
    # It gates the rest of the fleet on customer_id being valid.
